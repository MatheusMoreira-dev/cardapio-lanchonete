<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/output.css" />
    <title>Cardápio</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body class="min-h-screen flex flex-col">
    <header class="top-0 sticky w-full h-24 lg:h-64">
      <div
        class="w-full h-full flex justify-items-start lg:flex-col lg:justify-center items-center bg-banner px-4"
      >
        <img
          src="./src/assets/hamb-1.png"
          alt="Sua logo"
          class="w-16 h-16 lg:w-24 lg:h-24 lg:mb-3 rounded-full border-3 hover:scale-110 border-green-700 text-white text-center"
        />

        <h1 class="px-2 text-sm lg:text-2xl font-bold text-white">
          Nome do Restaurante
        </h1>

        <span id="endereco" class="font-light text-white hidden lg:inline"
          >Endereço do Restaurante</span
        >

        <div class="lg:mt-4 hidden lg:inline" id="funcionamento-span">
          <span class="bg-green-700 px-4 py-1 rounded-2xl text-white text-sm"
            >Aberto</span
          >
        </div>
      </div>
    </header>

    <main
      id="menu"
      class="w-full flex flex-col pt-5 grow max-w-7xl md:mx-auto mx-0 bg-zinc-100 mb-20"
    >
      <!--Hámburguers-->
      <div class="mb-10">
        <h1 class="pl-5 font-bold text-xl md:text-2xl mb-3">Hámburguers</h1>

        <!--Grade de Items-->
        <div
          id="menuHamburguers"
          class="grid grid-flow-col grid-rows-4 lg:grid-rows-3 auto-cols-[90%] md:auto-cols-[55%] lg:auto-cols-[45%] gap-2 md:gap-4 overflow-x-auto p-1"
        ></div>
      </div>

      <!--Bebidas-->
      <div>
        <h1 class="pl-5 font-bold text-xl md:text-2xl mb-3">Bebidas</h1>

        <!--Grid de bebidas-->
        <div
          id="menuBebidas"
          class="grid grid-flow-col grid-rows-3 lg:grid-rows-2 auto-cols-[90%] sm:auto-cols-[70%] md:auto-cols-[55%] lg:auto-cols-[45%] gap-2 md:gap-4 overflow-x-auto p-1"
        ></div>
      </div>
    </main>

    <footer
      class="w-full flex h-15 bg-red-400 sticky bottom-0 items-center justify-center z-50"
    >
      <button
        id="openCartBtn"
        class="cursor-pointer text-white flex items-center justify-center gap-1 w-full"
      >
        <i class="fa-solid fa-basket-shopping"></i>
        <span class="text-sm">Ver Pedido</span>
        (<span id="cart-count" class="text-xs font-mono">2</span>)
      </button>
    </footer>

    <!--Modal do carrinho-->
    <div
      id="cartModal"
      class="w-full h-full fixed top-0 left-0 bg-black/50 z-99 hidden justify-center items-center"
    >
      <!--Modal-->
      <div
        class="bg-white w-2xl max-h-9/12 lg:max-h-225 rounded-md p-4 shadow-xl/20 flex flex-col"
      >
        <!--Header-->
        <div class="flex w-full pb-2 mb-3 border-b border-b-zinc-300">
          <!--Título-->
          <h2 class="grow text-center text-xl font-bold self-center">
            Meu Carrinho
          </h2>

          <button id="closeCartBtn" class="self-end">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <!--Conteúdo do Modal-->
        <div class="mb-2 grow overflow-y-auto px-1 flex flex-col">
          <!--Itens no Carrinho-->
          <div
            id="cartItems"
            class="bg-zinc-100 max-h-[50%] shrink-0 flex flex-col gap-1 justify-between p-2 overflow-y-auto rounded-t-md"
          ></div>

          <!--Resumo do pedido-->
          <div
            id="cartItemsTotal"
            class="border-t border-dashed border-zinc-700 bg-zinc-300 p-3 rounded-b-md"
          >
            <p class="font-semibold text-zinc-500">
              Total:
              <span id="cart-total" class="text-black">R$ 300,00</span>
            </p>
          </div>

          <!--Endereço de Entrega-->
          <div class="mt-2 grow">
            <label for="cidade-entrega" class="text-xs">Cidade</label>

            <select
              id="cidade-entrega"
              class="w-full mb-3 px-3 py-1 border-0 outline rounded-sm outline-zinc-400 focus:outline-blue-300"
              required
            >
              <option value="" disabled selected hidden>
                Selecione a cidade...
              </option>
              <option value="juazeiro">Juazeiro</option>
              <option value="crato">Crato</option>
              <option value="barbalha">Barbalha</option>
            </select>

            <label for="bairro-entrega" class="text-xs">Bairro</label>

            <select
              id="bairro-entrega"
              class="w-full mb-3 px-3 py-1 border-0 outline rounded-sm outline-zinc-400 focus:outline-blue-300"
              required
            >
              <option value="" disabled selected hidden>
                Selecione o bairro...
              </option>
              <option value="juazeiro">Juazeiro</option>
              <option value="crato">Crato</option>
              <option value="barbalha">Barbalha</option>
            </select>

            <label for="address" class="text-xs">Endereço de Entrega</label>
            <input
              id="address"
              type="text"
              class="px-3 py-1 w-full border-0 outline outline-zinc-400 rounded-sm mb-5 focus:outline-blue-300"
            />
          </div>
        </div>

        <!--Footer-->
        <div>
          <!--Botões-->
          <div class="flex w-full items-center gap-2">
            <button
              class="border border-red-400 text-red-500 px-4 py-1 rounded-md grow hover:bg-red-100 cursor-pointer active:bg-red-100"
            >
              Cancelar
            </button>

            <button
              class="text-white font-medium bg-green-600 px-4 py-1 rounded-md grow hover:bg-green-700 cursor-pointer active:bg-green-700"
            >
              Finalizar
            </button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
