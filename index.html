<!doctype html>
<html lang="pt-br">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/output.css" />
    <title>Cardápio</title>
  </head>
  <body>
    <header class="w-full h-[320px] bg-zinc-900">
      <div class="w-full h-full flex flex-col justify-center items-center">
        <img
          src=""
          alt="Sua logo"
          class="w-32 h-32 mb-5 rounded-full border-2 border-green-700 text-white text-center"
        />

        <h1 class="text-2xl font-bold text-white">Nome do Restaurante</h1>
        <span id="endereco" class="font-medium text-white"

        <div class="mt-5" id="funcionamento-span">

            class="bg-green-700 px-4 py-1 rounded-2xl text-white font-medium"
            >Horário de Funcionamento</span

        </div>
      </div>

    <main id="menu" class="grid grid-cols-4 mx-2 lg:mx-32">
      <div class="bg-amber-200"></div>
    </main>
